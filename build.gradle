plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def snapshotEnv = providers.environmentVariable("SNAPSHOT")
def isSnapshot = snapshotEnv.isPresent() && snapshotEnv.get().toBoolean()

version = "${minecraft_version}-${mod_version}${isSnapshot ? "-SNAPSHOT" : ""}"

def latestChangelog() {
    def lines = file("CHANGELOG.md").readLines()
    def body = []
    def started = false
    for (line in lines) {
        if (line.startsWith("## ")) {
            if (started) break
            started = true
            continue
        }
        if (started) body << line
    }
    def section = body.join("\n").trim()
    return section.isEmpty() ? file("CHANGELOG.md").text.trim() : section
}

group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = project.file('run-gametest')
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    jarJar(implementation("org.apache.commons:commons-csv:${commons_csv_version}")) {
        version {
            strictly "[${commons_csv_version},)"
            prefer commons_csv_version
        }
        exclude group: 'commons-io'
        exclude group: 'commons-codec'
    }
    additionalRuntimeClasspath("org.apache.commons:commons-csv:${commons_csv_version}") {
        exclude group: 'commons-io'
        exclude group: 'commons-codec'
    }
}

tasks.register("sourcesJar", Jar) {
    archiveClassifier.set("sources")
    from sourceSets.main.allJava
}

tasks.named("jar") {
    dependsOn("sourcesJar")
    manifest {
        attributes([
                'Implementation-Title'  : mod_name,
                'Implementation-Version': version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            version              : version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            mod_license          : mod_license,
            pack_format          : pack_format,
            loader_version_range : loader_version_range,
            neo_version_range    : neo_version_range,
            minecraft_version_range: minecraft_version_range
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    from(project.rootDir) {
        include 'LICENSE.md'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('copyGameTestStructures', Copy) {
    from "src/main/resources/data/${mod_id}/gametest/structures"
    into "run-gametest/gameteststructures"
    include '*.snbt'
}

tasks.register('cleanGameTestWorld', Delete) {
    delete "run-gametest/world"
}

tasks.named('runGameTestServer').configure {
    dependsOn 'cleanGameTestWorld'
    dependsOn 'copyGameTestStructures'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            name = "BreakInBlocks"
            url = isSnapshot ?
                    "https://maven.breakinblocks.com/snapshots" :
                    "https://maven.breakinblocks.com/releases"
            credentials {
                username = System.getenv("MAVEN_USER") ?: ""
                password = System.getenv("MAVEN_TOKEN") ?: ""
            }
        }
    }
}

publishMods {
    dryRun = providers.environmentVariable("CURSEFORGE_TOKEN").getOrNull() == null
    file = jar.archiveFile
    changelog = latestChangelog()
    version = project.version
    type = isSnapshot ? BETA : STABLE
    modLoaders.add("neoforge")
    displayName = "[${minecraft_version}] ${mod_name} ${mod_version}"

    curseforge {
        projectId = "1679492"
        projectSlug = "modpack-assistant"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = false
        serverRequired = true
    }
}

tasks.register('publishMaven') {
    description = 'Publishes the mod JAR and sources JAR to the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
}

tasks.register('publishMod') {
    description = 'Publishes the mod to CurseForge and the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMods', 'publishMaven'
}

tasks.named('publishMods') {
    finalizedBy 'publishMaven'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
